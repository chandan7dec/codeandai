version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: demo-class-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: demo_class
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: demo_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demo-class-app
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: demo_class
      DB_USER: demo_user
      DB_PASS: demo_pass
      DEBUG: "true"
      ORGANIZER_API_KEY: organizer-secret-key
      ENABLE_EMAIL: "false"
    volumes:
      - .:/var/www/html

volumes:
  mysql_data:
